name: Deploy Chinese website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_BASE_PATH: /llm-viz-cn
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts
      - name: Check TypeScript
        run: npm run typecheck
      - name: Build static website
        run: npm run build
      - name: Verify deployment paths
        run: |
          test -f out/index.html
          test -f out/llm/index.html
          test -f out/native.wasm
          test -f out/fonts/font-atlas.png
          test -f out/gpt-nano-sort-model.json
          grep -q '/llm-viz-cn/_next/' out/index.html
          touch out/.nojekyll
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check GitHub Pages configuration
        uses: actions/configure-pages@v5
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
